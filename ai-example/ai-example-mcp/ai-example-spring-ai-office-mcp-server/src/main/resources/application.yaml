server:
  port: 7090
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-example-spring-ai-office-mcp-server
  datasource:
    # 考勤工具的真实数据源：与主应用共用 nexus_agent 库
    url: jdbc:mysql://127.0.0.1:3307/nexus_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: REDACTED-PERSONAL-PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: office-mcp-hikari
      maximum-pool-size: 5
      minimum-idle: 1
      # 工具调用等不了太久：拿不到连接 3 秒就失败，让模型拿到明确错误而不是卡住
      connection-timeout: 3000
      # 库不可用时不要拖垮 MCP server 启动，建表/查询各自降级
      initialization-fail-timeout: -1
  ai:
    mcp:
      server:
        name: office-tools-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s  
  main:
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    servlet:
      load-on-startup: 1
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
logging:
  level:
    org.springframework.ai: DEBUG